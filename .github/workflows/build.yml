name: Build OnePlus 5T 4.4 Kernel with KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential bc bison flex libssl-dev libelf-dev clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip

      - name: Clone LineageOS 22.2 Kernel
        run: |
          git clone https://github.com/LineageOS/android_kernel_oneplus_msm8998.git -b lineage-22.2 --depth=1 kernel

      - name: Integrate KernelSU-Next (Legacy 4.4 Branch)
        run: |
          cd kernel
          # Use KernelSU-Next legacy branch designed specifically for kernel 4.4
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # Enable required kernel flags in defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/lineage_oneplus5_defconfig
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/lineage_oneplus5_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/lineage_oneplus5_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/lineage_oneplus5_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/lineage_oneplus5_defconfig

      - name: Build Kernel Image
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64

          # 1. Generate config using Clang
          make ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            lineage_oneplus5_defconfig

          # 2. Compile kernel image
          make -j$(nproc) ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            Image.gz-dtb

      - name: Package Flashable AnyKernel3 ZIP
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=dumpling/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=cheeseburger/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=OnePlus5T/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=OnePlus5/' anykernel.sh
          zip -r9 ../Lineage22_dumpling_KernelSU.zip * -x .git README.md *placeholder

      - name: Upload Finished Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Lineage22-dumpling
          path: Lineage22_dumpling_KernelSU.zip
